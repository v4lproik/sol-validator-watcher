<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found | Solana Validator Watcher</title>
    <meta name="theme-color" content="#08131f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="not-found-page">
    <main class="not-found-shell">
      <img src="assets/logo.svg" alt="Solana Validator Watcher logo" width="80" height="80">
      <p class="eyebrow">404</p>
      <h1>This page does not exist.</h1>
      <p>
        The main site lives at the root, and the generated coverage report lives under <code>/coverage/</code>.
      </p>
      <div class="cta-row">
        <a class="button button-accent" href="./">Go to homepage</a>
        <a class="button button-outline" href="./coverage/">Open coverage</a>
      </div>
    </main>
  </body>
</html>

global:
  resolve_timeout: 5m

route:
  receiver: operator-webhook
  group_by:
    - alertname
    - deployment
    - network
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: operator-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 100
        timeout: 10s

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - deployment
      - network

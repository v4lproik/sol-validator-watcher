services:
  watcher-devnet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?RUST_VERSION must come from mise.toml}
    image: sol-validator-watcher:local
    command:
      - --config
      - /app/config/remote/devnet.toml
    environment:
      RUST_LOG: info
      SOL_WATCHER_METRICS_HOST: "0.0.0.0"
      SOL_DEVNET_RPC_URL: ${SOL_DEVNET_RPC_URL}
      SOL_DEVNET_WS_URL: ${SOL_DEVNET_WS_URL}
    volumes:
      - ../config/remote/devnet.toml:/app/config/remote/devnet.toml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WATCHER_DEVNET_METRICS_PORT:-8002}:8000"
    restart: on-failure

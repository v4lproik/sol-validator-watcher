services:
  watcher-devnet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?RUST_VERSION must come from mise.toml}
    image: sol-validator-watcher:local
    command:
      - --config
      - /app/config/remote/devnet.toml
    environment:
      RUST_LOG: info
      HELIUS_DEVNET_API_KEY: ${HELIUS_DEVNET_API_KEY}
    volumes:
      - ../config/remote/devnet.toml:/app/config/remote/devnet.toml:ro
    ports:
      - "${WATCHER_DEVNET_METRICS_PORT:-8002}:8000"
    restart: on-failure

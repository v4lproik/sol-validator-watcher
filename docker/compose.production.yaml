name: sol-validator-watcher-production

services:
  watcher-mainnet:
    image: ${SOL_WATCHER_IMAGE:?set SOL_WATCHER_IMAGE to a versioned, digest-pinned watcher image}
    pull_policy: always
    command: ["--config", "/app/config/remote/mainnet.toml"]
    env_file:
      - ${SOL_WATCHER_ENV_FILE:?set SOL_WATCHER_ENV_FILE to the root-owned watcher environment file}
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    ports:
      - "127.0.0.1:${WATCHER_MAINNET_METRICS_PORT:-8003}:8000"
    volumes:
      - ./../config/remote/mainnet.toml:/app/config/remote/mainnet.toml:ro
    healthcheck:
      test: ["CMD", "sol-validator-watcher", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 5
    networks:
      - egress
      - observability

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?set ALERTMANAGER_IMAGE to a versioned, digest-pinned Alertmanager image}
    pull_policy: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    init: true
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ulimits:
      nofile:
        soft: 32768
        hard: 32768
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    healthcheck:
      test: ["CMD", "/bin/amtool", "--alertmanager.url=http://127.0.0.1:9093", "status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - egress
      - observability

  prometheus:
    image: ${PROMETHEUS_IMAGE:?set PROMETHEUS_IMAGE to a versioned, digest-pinned Prometheus image}
    pull_policy: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --web.enable-lifecycle
    init: true
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.production.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      watcher-mainnet:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - observability

  grafana:
    image: ${GRAFANA_IMAGE:?set GRAFANA_IMAGE to a versioned, digest-pinned Grafana image}
    pull_policy: always
    init: true
    user: "472:472"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_UPDATE_CHECK_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - observability

networks:
  egress: {}
  observability:
    internal: true

volumes:
  alertmanager-data:
    name: sol-validator-watcher-alertmanager-data
  grafana-data:
    name: sol-validator-watcher-grafana-data
  prometheus-data:
    name: sol-validator-watcher-prometheus-data

secrets:
  alertmanager_webhook_url:
    file: ${ALERTMANAGER_WEBHOOK_URL_FILE:?set ALERTMANAGER_WEBHOOK_URL_FILE}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?set GRAFANA_ADMIN_PASSWORD_FILE}

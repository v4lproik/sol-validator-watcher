groups:
  - name: sol-validator-watcher
    rules:
      - alert: SolValidatorWatcherTargetDown
        expr: up{job="sol-validator-watcher"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Solana Validator Watcher target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for deployment {{ $labels.deployment }}."

      - alert: SolValidatorWatcherNotReady
        expr: sol_watcher_up == 1 and sol_watcher_ready == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Watcher is not ready for {{ $labels.network }}"
          description: "The watcher is serving metrics but has not completed five consecutive successful polling rounds."

      - alert: SolValidatorWatcherSourceFailoverActive
        expr: sol_watcher_up == 1 and sol_watcher_degraded == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Watcher source redundancy is degraded for {{ $labels.network }}"
          description: "A configured source failover circuit is open or probing; snapshots may remain complete through a backup connector."

      - alert: SolValidatorWatcherSnapshotStale
        expr: |
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            > clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
          or
          (sol_watcher_up == 1 unless sol_last_successful_snapshot_timestamp_seconds)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Watcher snapshot is stale for {{ $labels.network }}"
          description: "No complete snapshot has been published within the configured freshness window."

      - alert: SolValidatorWatcherRpcFailureBurst
        expr: increase(sol_rpc_request_failures_total[5m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Repeated {{ $labels.method }} failures on {{ $labels.connector }}"
          description: "Connector {{ $labels.connector }} recorded at least three {{ $labels.method }} failures in five minutes."

      - alert: SolValidatorWatcherWebsocketFailureBurst
        expr: increase(sol_ws_probe_failures_total[5m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "Repeated WebSocket probe failures on {{ $labels.connector }}"
          description: "Connector {{ $labels.connector }} recorded at least three WebSocket reachability failures in five minutes."

      - alert: SolValidatorNodeBehind
        expr: |
          (sol_node_health == 0)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Validator node {{ $labels.identity }} is behind"
          description: "The node-local RPC endpoint reports that {{ $labels.identity }} is behind the cluster tip on {{ $labels.network }}."

      - alert: SolValidatorNodeNotVoting
        expr: |
          (sol_node_info{voting_status!="current"} == 1)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Validator node {{ $labels.identity }} is not in the current vote set"
          description: "The node identity is reported as {{ $labels.voting_status }} on {{ $labels.network }}."

      - alert: SolValidatorWatchedValidatorDelinquent
        expr: |
          (sol_watched_validator_info{status="delinquent"} == 1)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Watched validator {{ $labels.identity }} is delinquent"
          description: "Vote account {{ $labels.vote_account }} is reported delinquent on {{ $labels.network }}."

      - alert: SolValidatorWatchedValidatorVoteLagHigh
        expr: |
          (sol_watched_validator_last_vote_slot_lag > 32)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Watched validator {{ $labels.identity }} has high vote lag"
          description: "Vote account {{ $labels.vote_account }} is more than 32 slots behind on {{ $labels.network }}."

      - alert: SolValidatorUpcomingLeaderUnhealthy
        expr: |
          (
            sol_watched_validator_seconds_until_next_leader > 0
            and sol_watched_validator_seconds_until_next_leader < 300
          )
          and on(job, instance, network, identity, vote_account)
          (
            sol_watched_validator_info{status="delinquent"} == 1
            or sol_watched_validator_last_vote_slot_lag > 32
          )
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unhealthy validator {{ $labels.identity }} leads within five minutes"
          description: "Vote account {{ $labels.vote_account }} has an upcoming leader slot while delinquent or lagging."

      - alert: SolValidatorVatNextEpochUnfunded
        expr: |
          (sol_economics_vat_next_epoch_funded == 0)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Vote account {{ $labels.vote_account }} lacks next-epoch VAT funding"
          description: "The available reserve is below the 0.8 SOL vote-account charge for the next epoch."

      - alert: SolValidatorWatcherConfigReloadRejected
        expr: |
          sum by (job, instance, deployment, network) (
            increase(sol_config_reload_total{outcome="rejected"}[15m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Watcher rejected a configuration reload for {{ $labels.network }}"
          description: "The last-known-good profile remains active; inspect watcher logs and the active config fingerprint."

      - alert: SolValidatorWatcherFallbackActive
        expr: |
          max by (job, instance, deployment, network, mode, command, connector) (
            sol_mode_command_fallback_active
          ) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.command }} is using fallback connector {{ $labels.connector }}"
          description: "Mode {{ $labels.mode }} has used a non-primary connector for at least ten minutes."

      - alert: SolValidatorWatcherBlockFeeCacheIneffective
        expr: |
          sum by (job, instance, deployment, network, connector) (
            increase(sol_rpc_block_fee_methods_requested_total[15m])
          ) > 128
          and on(job, instance, deployment, network, connector)
          (
            sum by (job, instance, deployment, network, connector) (
              increase(sol_rpc_block_fee_cache_accesses_total{outcome="miss"}[15m])
            )
            /
            clamp_min(
              sum by (job, instance, deployment, network, connector) (
                increase(sol_rpc_block_fee_cache_accesses_total[15m])
              ),
              1
            )
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Block-fee cache is ineffective for {{ $labels.connector }}"
          description: "The finalized block-fee route has a sustained cache-miss majority and is sending excessive getBlock methods."

      - alert: SolValidatorTrilliumMevCaptureUnavailable
        expr: |
          (
            (
              max by (job, instance, deployment, network) (
                sol_mode_command_route_info{
                  mode="economics",
                  command="trillium-mev-capture",
                  available="true"
                }
              ) == 1
            )
            and on(job, instance, deployment, network)
            (sol_mode_up{mode="economics"} == 1)
            unless on(job, instance, deployment, network)
            sol_economics_trillium_mev_capture_epoch
          )
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Trillium MEV capture is unavailable for {{ $labels.network }}"
          description: "The configured Trillium route has not published a completed-epoch MEV capture while economics collection is healthy."

      - alert: SolValidatorTrilliumBlockMissRateHigh
        expr: |
          (
            100 * (
              sol_economics_trillium_leader_slots
              - sol_economics_trillium_blocks_produced
            )
            / clamp_min(sol_economics_trillium_leader_slots, 1)
            > 10
          )
          and on(job, instance, deployment, network, identity, vote_account)
          (sol_economics_trillium_leader_slots >= 32)
          and on(job, instance, network)
          (
            time() - sol_last_successful_snapshot_timestamp_seconds
            <= clamp_min(4 * sol_watcher_poll_interval_seconds, 120)
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Validator {{ $labels.identity }} missed more than 10% of Trillium leader slots"
          description: "The latest Trillium completed epoch reports at least 32 leader slots and a block miss rate above 10% for vote account {{ $labels.vote_account }}."

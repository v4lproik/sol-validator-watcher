rule_files:
  - /etc/prometheus/rules/sol-validator-watcher.yml

evaluation_interval: 1m

tests:
  - name: watcher availability and freshness alerts
    interval: 1m
    input_series:
      - series: 'up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet"}'
        values: '0+0x6'
      - series: 'sol_watcher_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '1+0x6'
      - series: 'sol_watcher_ready{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+0x6'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x6'
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatcherTargetDown
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              severity: critical
            exp_annotations:
              summary: "Solana Validator Watcher target is down"
              description: "Prometheus cannot scrape watcher:8000 for deployment mainnet."
      - eval_time: 5m
        alertname: SolValidatorWatcherNotReady
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Watcher is not ready for mainnet-beta"
              description: "The watcher is serving metrics but has not completed five consecutive clean polling rounds."
      - eval_time: 5m
        alertname: SolValidatorWatcherSnapshotStale
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
            exp_annotations:
              summary: "Watcher snapshot is stale for mainnet-beta"
              description: "No complete snapshot has been published within the configured freshness window."

  - name: watcher without a successful snapshot
    interval: 1m
    input_series:
      - series: 'sol_watcher_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '1+0x3'
    alert_rule_test:
      - eval_time: 2m
        alertname: SolValidatorWatcherSnapshotStale
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
            exp_annotations:
              summary: "Watcher snapshot is stale for mainnet-beta"
              description: "No complete snapshot has been published within the configured freshness window."

  - name: rpc failure burst alert
    interval: 1m
    input_series:
      - series: 'sol_rpc_request_failures_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",connector="primary",method="getEpochInfo"}'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatcherRpcFailureBurst
        exp_alerts:
          - exp_labels:
              connector: primary
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              method: getEpochInfo
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Repeated getEpochInfo failures on primary"
              description: "Connector primary recorded at least three getEpochInfo failures in five minutes."


  - name: websocket probe failure burst alert
    interval: 1m
    input_series:
      - series: 'sol_ws_probe_failures_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",connector="primary-ws"}'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatcherWebsocketFailureBurst
        exp_alerts:
          - exp_labels:
              connector: primary-ws
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Repeated WebSocket probe failures on primary-ws"
              description: "Connector primary-ws recorded at least three WebSocket reachability failures in five minutes."
  - name: node-local operator health alerts
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0 60 120 180 240 300'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x5'
      - series: 'sol_node_health{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1"}'
        values: '0+0x5'
      - series: 'sol_node_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",version="3.1.8",feature_set="2891131721",voting_status="not-found"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorNodeBehind
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
            exp_annotations:
              summary: "Validator node validator-1 is behind"
              description: "The node-local RPC endpoint reports that validator-1 is behind the cluster tip on mainnet-beta."
      - eval_time: 5m
        alertname: SolValidatorNodeNotVoting
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              feature_set: "2891131721"
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
              version: "3.1.8"
              voting_status: not-found
            exp_annotations:
              summary: "Validator node validator-1 is not in the current vote set"
              description: "The node identity is reported as not-found on mainnet-beta."

  - name: fresh validator risk and funding alerts
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0 60 120 180 240 300'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x5'
      - series: 'sol_watched_validator_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1",status="delinquent"}'
        values: '1+0x5'
      - series: 'sol_watched_validator_last_vote_slot_lag{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1",status="delinquent"}'
        values: '40+0x5'
      - series: 'sol_watched_validator_seconds_until_next_leader{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1",status="delinquent"}'
        values: '200+0x5'
      - series: 'sol_economics_vat_next_epoch_funded{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatchedValidatorDelinquent
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
              status: delinquent
              vote_account: vote-1
            exp_annotations:
              summary: "Watched validator validator-1 is delinquent"
              description: "Vote account vote-1 is reported delinquent on mainnet-beta."
      - eval_time: 5m
        alertname: SolValidatorWatchedValidatorVoteLagHigh
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
              status: delinquent
              vote_account: vote-1
            exp_annotations:
              summary: "Watched validator validator-1 has high vote lag"
              description: "Vote account vote-1 is more than 32 slots behind on mainnet-beta."
      - eval_time: 5m
        alertname: SolValidatorUpcomingLeaderUnhealthy
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
              status: delinquent
              vote_account: vote-1
            exp_annotations:
              summary: "Unhealthy validator validator-1 leads within five minutes"
              description: "Vote account vote-1 has an upcoming leader slot while delinquent or lagging."
      - eval_time: 5m
        alertname: SolValidatorVatNextEpochUnfunded
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
              vote_account: vote-1
            exp_annotations:
              summary: "Vote account vote-1 lacks next-epoch VAT funding"
              description: "The available reserve is below the 0.8 SOL vote-account charge for the next epoch."

  - name: stale snapshot suppresses snapshot condition alerts
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+0x6'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x6'
      - series: 'sol_watched_validator_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1",status="delinquent"}'
        values: '1+0x6'
      - series: 'sol_node_health{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1"}'
        values: '0+0x6'
      - series: 'sol_node_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",version="3.1.8",feature_set="2891131721",voting_status="not-found"}'
        values: '1+0x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatchedValidatorDelinquent
        exp_alerts: []
      - eval_time: 5m
        alertname: SolValidatorNodeBehind
        exp_alerts: []
      - eval_time: 5m
        alertname: SolValidatorNodeNotVoting
        exp_alerts: []

  - name: slow polling interval extends freshness window
    interval: 1m
    input_series:
      - series: 'sol_watcher_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '1+0x11'
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+0x11'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '120+0x11'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatcherSnapshotStale
        exp_alerts: []
      - eval_time: 11m
        alertname: SolValidatorWatcherSnapshotStale
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: critical
            exp_annotations:
              summary: "Watcher snapshot is stale for mainnet-beta"
              description: "No complete snapshot has been published within the configured freshness window."

  - name: rejected configuration reload alert
    interval: 1m
    input_series:
      - series: 'sol_config_reload_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",outcome="rejected"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: SolValidatorWatcherConfigReloadRejected
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Watcher rejected a configuration reload for mainnet-beta"
              description: "The last-known-good profile remains active; inspect watcher logs and the active config fingerprint."

  - name: sustained connector fallback alert
    interval: 1m
    input_series:
      - series: 'sol_mode_command_fallback_active{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="consensus",command="epoch-info",connector="backup-rpc"}'
        values: '1+0x11'
    alert_rule_test:
      - eval_time: 11m
        alertname: SolValidatorWatcherFallbackActive
        exp_alerts:
          - exp_labels:
              command: epoch-info
              connector: backup-rpc
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              mode: consensus
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "epoch-info is using fallback connector backup-rpc"
              description: "Mode consensus has used a non-primary connector for at least ten minutes."

  - name: ineffective finalized block fee cache alert
    interval: 1m
    input_series:
      - series: 'sol_rpc_block_fee_methods_requested_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",connector="mainnet-rpc"}'
        values: '0+20x15'
      - series: 'sol_rpc_block_fee_cache_accesses_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",connector="mainnet-rpc",outcome="miss"}'
        values: '0+15x15'
      - series: 'sol_rpc_block_fee_cache_accesses_total{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",connector="mainnet-rpc",outcome="hit"}'
        values: '0+5x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: SolValidatorWatcherBlockFeeCacheIneffective
        exp_alerts:
          - exp_labels:
              connector: mainnet-rpc
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Block-fee cache is ineffective for mainnet-rpc"
              description: "The finalized block-fee route has a sustained cache-miss majority and is sending excessive getBlock methods."

  - name: uncacheable confirmed block fee requests do not alert
    interval: 1m
    input_series:
      - series: 'sol_rpc_block_fee_methods_requested_total{job="sol-validator-watcher",instance="watcher:8000",deployment="devnet",network="devnet",connector="devnet-rpc"}'
        values: '0+32x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: SolValidatorWatcherBlockFeeCacheIneffective
        exp_alerts: []

  - name: Trillium MEV availability and block production alerts
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+60x20'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x20'
      - series: 'sol_mode_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics"}'
        values: '1+0x20'
      - series: 'sol_mode_command_route_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics",command="trillium-mev-capture",connector="trillium-api",provider="trillium",transport="provider-api",required_solana_rpc_compatibility="",solana_rpc_compatibility="",feature="trillium-mev-capture",precedence="1",available="true"}'
        values: '1+0x20'
      - series: 'sol_economics_trillium_leader_slots{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1"}'
        values: '100+0x20'
      - series: 'sol_economics_trillium_blocks_produced{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1"}'
        values: '85+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SolValidatorTrilliumMevCaptureUnavailable
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
            exp_annotations:
              summary: "Trillium MEV capture is unavailable for mainnet-beta"
              description: "The configured Trillium route has not published a completed-epoch MEV capture while economics collection is healthy."
      - eval_time: 16m
        alertname: SolValidatorTrilliumBlockMissRateHigh
        exp_alerts:
          - exp_labels:
              deployment: mainnet
              identity: validator-1
              instance: watcher:8000
              job: sol-validator-watcher
              network: mainnet-beta
              severity: warning
              vote_account: vote-1
            exp_annotations:
              summary: "Validator validator-1 missed more than 10% of Trillium leader slots"
              description: "The latest Trillium completed epoch reports at least 32 leader slots and a block miss rate above 10% for vote account vote-1."

  - name: unavailable Trillium route does not alert
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+60x20'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x20'
      - series: 'sol_mode_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics"}'
        values: '1+0x20'
      - series: 'sol_mode_command_route_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics",command="trillium-mev-capture",connector="trillium-api",provider="trillium",transport="provider-api",required_solana_rpc_compatibility="",solana_rpc_compatibility="",feature="trillium-mev-capture",precedence="1",available="false"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SolValidatorTrilliumMevCaptureUnavailable
        exp_alerts: []

  - name: stale snapshots suppress Trillium alerts
    interval: 1m
    input_series:
      - series: 'sol_last_successful_snapshot_timestamp_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '0+0x20'
      - series: 'sol_watcher_poll_interval_seconds{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta"}'
        values: '15+0x20'
      - series: 'sol_mode_up{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics"}'
        values: '1+0x20'
      - series: 'sol_mode_command_route_info{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",mode="economics",command="trillium-mev-capture",connector="trillium-api",provider="trillium",transport="provider-api",required_solana_rpc_compatibility="",solana_rpc_compatibility="",feature="trillium-mev-capture",precedence="1",available="true"}'
        values: '1+0x20'
      - series: 'sol_economics_trillium_leader_slots{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1"}'
        values: '100+0x20'
      - series: 'sol_economics_trillium_blocks_produced{job="sol-validator-watcher",instance="watcher:8000",deployment="mainnet",network="mainnet-beta",identity="validator-1",vote_account="vote-1"}'
        values: '85+0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: SolValidatorTrilliumMevCaptureUnavailable
        exp_alerts: []
      - eval_time: 16m
        alertname: SolValidatorTrilliumBlockMissRateHigh
        exp_alerts: []

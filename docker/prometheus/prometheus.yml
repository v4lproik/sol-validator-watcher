global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: sol-validator-watcher
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus-targets/active.json

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

services:
  surfpool:
    image: surfpool/surfpool:1.0
    command:
      - start
      - --offline
      - --ci
      - --no-deploy
      - --no-tui
      - --host
      - 0.0.0.0
      - --port
      - "8899"
      - --ws-port
      - "8900"
      - --studio-port
      - "3000"
    ports:
      - "${SURFPOOL_HOST_RPC_PORT:-18899}:8899"
      - "${SURFPOOL_HOST_WS_PORT:-18900}:8900"
      - "${SURFPOOL_HOST_STUDIO_PORT:-13000}:3000"
    restart: unless-stopped

  watcher-surfpool:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?RUST_VERSION must come from mise.toml}
    image: sol-validator-watcher:local
    command:
      - --config
      - /app/config/compose/surfpool/watcher.yaml
    environment:
      RUST_LOG: info
    volumes:
      - ../config/compose/surfpool:/app/config/compose/surfpool:ro
    depends_on:
      - surfpool
    ports:
      - "${WATCHER_SURFPOOL_METRICS_PORT:-8000}:8000"
    restart: on-failure

services:
  surfpool:
    image: surfpool/surfpool:1.0
    command:
      - start
      - --offline
      - --ci
      - --no-deploy
      - --no-tui
      - --host
      - 0.0.0.0
      - --port
      - "8899"
      - --ws-port
      - "8900"
      - --studio-port
      - "3000"
    ports:
      - "127.0.0.1:${SURFPOOL_HOST_RPC_PORT:-18899}:8899"
      - "127.0.0.1:${SURFPOOL_HOST_WS_PORT:-18900}:8900"
      - "127.0.0.1:${SURFPOOL_HOST_STUDIO_PORT:-13000}:3000"
    restart: unless-stopped

  watcher-surfpool:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?RUST_VERSION must come from mise.toml}
    image: sol-validator-watcher:local
    command:
      - --config
      - /app/config/compose/surfpool.toml
    environment:
      RUST_LOG: info
    volumes:
      - ../config/compose/surfpool.toml:/app/config/compose/surfpool.toml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - surfpool
    ports:
      - "127.0.0.1:${WATCHER_SURFPOOL_METRICS_PORT:-8000}:8000"
    restart: on-failure

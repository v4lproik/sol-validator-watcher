services:
  watcher-validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:?RUST_VERSION must come from mise.toml}
    image: sol-validator-watcher:local
    command:
      - --config
      - /app/config/compose/validator.toml
    environment:
      RUST_LOG: info
      SOL_WATCHER_NETWORK: ${SOL_WATCHER_NETWORK:-external-validator}
      SOL_VALIDATOR_RPC_URL: ${SOL_VALIDATOR_RPC_URL:-http://host.docker.internal:8899}
      SOL_VALIDATOR_SOLANA_RPC_COMPATIBILITY: ${SOL_VALIDATOR_SOLANA_RPC_COMPATIBILITY:-core}
      SOL_WATCHER_RPC_REQUEST_TIMEOUT_SEC: ${SOL_WATCHER_RPC_REQUEST_TIMEOUT_SEC:-30}
      SOL_WATCHER_RPC_CONNECT_TIMEOUT_SEC: ${SOL_WATCHER_RPC_CONNECT_TIMEOUT_SEC:-10}
      SOL_WATCHER_POLL_INTERVAL_SEC: ${SOL_WATCHER_POLL_INTERVAL_SEC:-15}
      SOL_WATCHER_COMMITMENT: ${SOL_WATCHER_COMMITMENT:-confirmed}
      SOL_WATCHER_DELINQUENT_SLOT_DISTANCE: ${SOL_WATCHER_DELINQUENT_SLOT_DISTANCE:-128}
    volumes:
      - ../config/compose/validator.toml:/app/config/compose/validator.toml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${WATCHER_VALIDATOR_METRICS_PORT:-8001}:8000"
    restart: on-failure

[package]
name = "sol-validator-watcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prometheus watcher for Solana validators, inspired by kilnfi/eth-validator-watcher"

[dependencies]
anyhow = "=1.0.96"
axum = "=0.7.5"
clap = { version = "=4.5.31", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
prometheus = "=0.13.4"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.139"
tokio = { version = "=1.43.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "=0.20.1", features = ["rustls-tls-webpki-roots"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "config"
harness = false

[package]
name = "sol-validator-watcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Prometheus watcher for Solana validators, inspired by kilnfi/eth-validator-watcher"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.5.31", features = ["derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
prometheus = "=0.14.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.139"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "config"
harness = false

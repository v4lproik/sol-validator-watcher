[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
prometheus = "=0.14.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sol-validator-watcher-config = { version = "0.1.0", path = "crates/config" }
sol-validator-watcher-domain = { version = "0.1.0", path = "crates/domain" }
sol-validator-watcher-prometheus = { version = "0.1.0", path = "crates/prometheus" }
sol-validator-watcher-source = { version = "0.1.0", path = "crates/source" }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[package]
name = "sol-validator-watcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prometheus watcher for Solana validators, inspired by kilnfi/eth-validator-watcher"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sol-validator-watcher-config.workspace = true
sol-validator-watcher-domain.workspace = true
sol-validator-watcher-prometheus.workspace = true
sol-validator-watcher-source.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

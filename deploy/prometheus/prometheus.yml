global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sol-validator-watcher
    metrics_path: /metrics
    static_configs:
      - targets:
          - watcher-surfpool:8000
        labels:
          deployment: surfpool
      - targets:
          - watcher-validator:8000
        labels:
          deployment: validator
      - targets:
          - watcher-devnet:8000
        labels:
          deployment: devnet
      - targets:
          - watcher-mainnet:8000
        labels:
          deployment: mainnet

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

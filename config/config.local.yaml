network: mainnet-beta
connectors:
  - name: local-validator
    kind: standard-validator+rpc
    connection_file: validator.local.toml
validator_mode: consensus
validator_websocket_enabled: false
metrics_port: 8000
poll_interval_sec: 15
liveness_file: /tmp/sol-validator-watcher.liveness

watched_validators:
  - identity: 11111111111111111111111111111111
    labels:
      - vc:validator-1
      - region:sbg

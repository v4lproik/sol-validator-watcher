network = "mainnet-beta"
metrics_port = 8000
poll_interval_sec = 15
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Connectors are tried in declaration order for each metric.
[[connectors]]
name = "local-validator"
kind = "standard-validator+rpc"
rpc_url = "http://127.0.0.1:8899"
rpc_timeout_sec = 30
ws_timeout_sec = 10
commitment = "confirmed"

[[watched_validators]]
identity = "11111111111111111111111111111111"
labels = ["vc:validator-1", "region:sbg"]

[economics]
mode = "disabled"

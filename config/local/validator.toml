network = "mainnet-beta"
metrics_port = 8000
poll_interval_sec = 15
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "local-validator"
provider = "solana-validator"
features = []
solana_rpc_compatibility = "core"
rpc_url = "http://127.0.0.1:8899"
rpc_timeout_sec = 30
ws_timeout_sec = 10
commitment = "confirmed"

[[watched_validators]]
identity = "11111111111111111111111111111111"
labels = ["vc:validator-1", "region:sbg"]

[modes.health.commands]
rpc_health = ["local-validator"]
node_status = ["local-validator"]

[modes.consensus.commands]
epoch_info = ["local-validator"]
vote_accounts = ["local-validator"]
recent_performance_samples = []

[modes.leadership.commands]
current_block_production = []
current_leader_schedule = ["local-validator"]
next_leader_schedule = ["local-validator"]

[modes.economics]
enabled = false

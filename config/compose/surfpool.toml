network = "surfpool-localnet"
metrics_port = 8000
poll_interval_sec = 5
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "surfpool"
provider = "surfpool"
features = []
rpc_url = "http://surfpool:8899"
rpc_timeout_sec = 5
ws_url = "ws://surfpool:8900"
ws_timeout_sec = 5
commitment = "confirmed"

[modes.health.commands]
rpc_health = ["surfpool"]
ws_health = ["surfpool"]

[modes.consensus.commands]
epoch_info = ["surfpool"]
vote_accounts = ["surfpool"]

[modes.leadership.commands]
current_block_production = ["surfpool"]
current_leader_schedule = ["surfpool"]
next_leader_schedule = ["surfpool"]

[modes.economics]
enabled = false

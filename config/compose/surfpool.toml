network = "surfpool-localnet"
metrics_port = 8000
poll_interval_sec = 5
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Connectors are tried in declaration order for each metric.
[[connectors]]
name = "surfpool"
kind = "standard-validator+rpc"
rpc_url = "http://surfpool:8899"
rpc_timeout_sec = 5
ws_url = "ws://surfpool:8900"
ws_timeout_sec = 5
commitment = "confirmed"

[economics]
mode = "disabled"

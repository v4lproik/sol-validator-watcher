network = "surfpool-localnet"
metrics_host = "0.0.0.0"
metrics_port = 8000
poll_interval_sec = 5
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "surfpool"
provider = "surfpool"
features = []
solana_rpc_compatibility = "extended"
[connectors.rpc]
url = "http://surfpool:8899"
request_timeout_sec = 5
connect_timeout_sec = 5
response_size_limit_bytes = 33554432
commitment = "confirmed"

[connectors.websocket]
url = "ws://surfpool:8900"
handshake_timeout_sec = 5

[modes.health.commands]
rpc_health = ["surfpool"]
ws_health = ["surfpool"]
node_status = ["surfpool"]

[modes.consensus.commands]
epoch_info = ["surfpool"]
vote_accounts = ["surfpool"]
cluster_nodes = ["surfpool"]
recent_performance_samples = ["surfpool"]

[modes.leadership.commands]
current_block_production = ["surfpool"]
current_leader_schedule = ["surfpool"]
next_leader_schedule = ["surfpool"]

[modes.economics]
enabled = false

network: ${SOL_WATCHER_NETWORK:-external-validator}
validator_connection_file: connection.toml
validator_mode: ${SOL_WATCHER_VALIDATOR_MODE:-consensus-and-rpc}
validator_websocket_enabled: ${SOL_WATCHER_VALIDATOR_WEBSOCKET_ENABLED:-false}
metrics_port: 8000
poll_interval_sec: ${SOL_WATCHER_POLL_INTERVAL_SEC:-15}
delinquent_slot_distance: ${SOL_WATCHER_DELINQUENT_SLOT_DISTANCE:-128}
liveness_file: /tmp/sol-validator-watcher.liveness

watched_validators: []

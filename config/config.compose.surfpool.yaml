network: surfpool-localnet
connectors:
  - name: surfpool
    kind: standard-validator+rpc
    connection_file: validator.compose.surfpool.toml
validator_mode: consensus-and-rpc
validator_websocket_enabled: true
metrics_port: 8000
poll_interval_sec: 5
delinquent_slot_distance: 128
liveness_file: /tmp/sol-validator-watcher.liveness

watched_validators: []

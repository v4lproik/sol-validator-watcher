# Container-oriented profile: publish port 8000 on a loopback host address.
# Keep real RPC credentials in .env or exported environment variables.
network = "mainnet-beta"
metrics_host = "0.0.0.0"
metrics_port = 8000
poll_interval_sec = 15
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "mainnet-rpc"
provider = "helius"
features = ["historical-data", "block-fee-rewards"]
solana_rpc_compatibility = "extended"
[connectors.rpc]
url = "${SOL_MAINNET_RPC_URL}"
request_timeout_sec = 30
connect_timeout_sec = 10
response_size_limit_bytes = ${SOL_WATCHER_RPC_RESPONSE_SIZE_LIMIT_BYTES:-33554432}
commitment = "finalized"

[connectors.websocket]
url = "${SOL_MAINNET_WS_URL}"
handshake_timeout_sec = 10

[[connectors]]
name = "jito-api"
provider = "jito"
features = ["jito-mev-rewards"]
[connectors.provider_api]
url = "${JITO_API_URL:-https://kobe.mainnet.jito.network/api/v1}"
request_timeout_sec = 30
connect_timeout_sec = 10

[[connectors]]
name = "trillium-api"
provider = "trillium"
features = ["trillium-mev-capture"]
[connectors.provider_api]
url = "${TRILLIUM_API_URL:-https://api.trillium.so}"
request_timeout_sec = 30
connect_timeout_sec = 10

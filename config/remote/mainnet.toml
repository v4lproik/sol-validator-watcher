# Template only. Keep real RPC credentials in .env or exported environment variables.
network = "mainnet-beta"
metrics_port = 8000
poll_interval_sec = 15
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "mainnet-rpc"
kind = "helius+rpc"
rpc_url = "${SOL_MAINNET_RPC_URL}"
rpc_timeout_sec = 30
ws_url = "${SOL_MAINNET_WS_URL}"
ws_timeout_sec = 10
commitment = "confirmed"

[[watched_validators]]
vote_account = "BeRtYZ7SVQozwTby6ajQzrHtKYkn4qoKyRfb3NDAedtA"
labels = ["validator:big-berty", "state:delinquent"]

[[watched_validators]]
vote_account = "3dXXxEaV4fZqw1PL7VezfDkiJV5W4WTtRjh2EHgKSthF"
labels = ["validator:hedgehog-spiky", "state:delinquent"]

[[watched_validators]]
vote_account = "PUFFiNkUHF2DMfbKeUcYTSQckDDtkswfxZCDv5WQqwp"
labels = ["validator:puffin", "state:top-voter"]

[[watched_validators]]
vote_account = "D7WodK26tETSqyWBW35vvMGfige9afLEyTsm1Pvvropd"
labels = ["validator:litx", "state:top-voter"]

[modes.health.commands]
rpc_health = ["mainnet-rpc"]
ws_health = ["mainnet-rpc"]

[modes.consensus.commands]
epoch_info = ["mainnet-rpc"]
vote_accounts = ["mainnet-rpc"]

[modes.leadership.commands]
current_block_production = ["mainnet-rpc"]
current_leader_schedule = ["mainnet-rpc"]
next_leader_schedule = ["mainnet-rpc"]

[modes.economics]
enabled = false

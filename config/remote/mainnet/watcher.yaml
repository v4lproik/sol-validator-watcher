  # validator:
  #   vote_account: PUFFiNkUHF2DMfbKeUcYTSQckDDtkswfxZCDv5WQqwp
  #   labels: ["validator:puffin", "focus:economics"]

# Economics mode requires RPC support for getInflationReward and reward-epoch block production.

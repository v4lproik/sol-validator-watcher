# Container-oriented profile: publish port 8000 on a loopback host address.
# Keep complete credential-bearing RPC and WebSocket URLs in .env or exported environment variables.
network = "devnet"
metrics_host = "0.0.0.0"
metrics_port = 8000
poll_interval_sec = 15
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route maps its mode to the provider, required feature, and transport
# resolved through this connector.
[[connectors]]
name = "helius-devnet"
provider = "helius"
features = ["historical-data"]
solana_rpc_compatibility = "extended"
[connectors.rpc]
url = "${SOL_DEVNET_RPC_URL}"
request_timeout_sec = 30
connect_timeout_sec = 10
response_size_limit_bytes = 33554432
commitment = "confirmed"

[connectors.websocket]
url = "${SOL_DEVNET_WS_URL}"
handshake_timeout_sec = 10

[[watched_validators]]
vote_account = "FwR3PbjS5iyqzLiLugrBqKSa5EKZ4vK9SKs7eQXtT59f"
labels = ["operator:kiln", "validator:kiln-devnet"]

[modes.health.commands]
rpc_health = ["helius-devnet"]
ws_health = ["helius-devnet"]

[modes.consensus.commands]
epoch_info = ["helius-devnet"]
vote_accounts = ["helius-devnet"]
cluster_nodes = ["helius-devnet"]
recent_performance_samples = ["helius-devnet"]

[modes.leadership.commands]
current_block_production = ["helius-devnet"]
current_leader_schedule = ["helius-devnet"]
next_leader_schedule = ["helius-devnet"]

[modes.economics]
enabled = true

[modes.economics.commands]
account_balances = ["helius-devnet"]
inflation_rewards = ["helius-devnet"]
reward_epoch_block_production = ["helius-devnet"]

[modes.economics.validator]
vote_account = "FwR3PbjS5iyqzLiLugrBqKSa5EKZ4vK9SKs7eQXtT59f"
labels = ["operator:kiln", "validator:kiln-devnet"]

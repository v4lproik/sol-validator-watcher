# Template only. Keep real RPC credentials in .env or exported environment variables.
network = "devnet"
metrics_port = 8000
poll_interval_sec = 15
delinquent_slot_distance = 128
liveness_file = "/tmp/sol-validator-watcher.liveness"

# Each command route is an explicit connector fallback order.
[[connectors]]
name = "devnet-rpc"
provider = "helius"
features = ["historical-data"]
rpc_url = "${SOL_DEVNET_RPC_URL}"
rpc_timeout_sec = 30
ws_url = "${SOL_DEVNET_WS_URL}"
ws_timeout_sec = 10
commitment = "confirmed"

[[watched_validators]]
vote_account = "FwR3PbjS5iyqzLiLugrBqKSa5EKZ4vK9SKs7eQXtT59f"
labels = ["operator:kiln", "validator:kiln-devnet"]

[modes.health.commands]
rpc_health = ["devnet-rpc"]
ws_health = ["devnet-rpc"]

[modes.consensus.commands]
epoch_info = ["devnet-rpc"]
vote_accounts = ["devnet-rpc"]

[modes.leadership.commands]
current_block_production = ["devnet-rpc"]
current_leader_schedule = ["devnet-rpc"]
next_leader_schedule = ["devnet-rpc"]

[modes.economics]
enabled = false
# Enable economics only on RPC endpoints that can serve getInflationReward and

name: ci

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install toolchain with mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Verify toolchain
        run: just rust doctor

      - name: Run CI checks
        run: just ci verify

      - name: Validate Prometheus configuration and alert rules
        run: just stack check

      - name: Build Rust documentation
        run: just rust doc

      - name: Enforce coverage gate
        run: just coverage check

      - name: Generate LCOV report
        run: just coverage lcov

      - name: Generate HTML coverage report
        run: just coverage html

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-html
          path: coverage
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ !github.event.repository.private || env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./lcov.info
          flags: unit
          fail_ci_if_error: false
          verbose: true

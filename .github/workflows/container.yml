name: container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    if: ${{ github.event_name == 'pull_request' }}
    needs: verify
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Resolve Rust version
        id: rust
        shell: bash
        run: echo "version=$(mise config get tools.rust.version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact verification image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            RUST_VERSION=${{ steps.rust.outputs.version }}
            SOL_WATCHER_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: sol-validator-watcher:verify
          cache-from: type=gha

      - name: Smoke exact verification image
        run: just container smoke sol-validator-watcher:verify "${GITHUB_SHA}"

      - name: Scan exact verification image
        run: just security image sol-validator-watcher:verify

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Resolve Rust version
        id: rust
        shell: bash
        run: echo "version=$(mise config get tools.rust.version)" >> "${GITHUB_OUTPUT}"

      - name: Compute image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build exact verification image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            RUST_VERSION=${{ steps.rust.outputs.version }}
            SOL_WATCHER_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: sol-validator-watcher:verify
          cache-from: type=gha

      - name: Smoke exact verification image
        run: just container smoke sol-validator-watcher:verify "${GITHUB_SHA}"

      - name: Scan exact verification image
        run: just security image sol-validator-watcher:verify

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: |
            RUST_VERSION=${{ steps.rust.outputs.version }}
            SOL_WATCHER_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and smoke published digest
        shell: bash
        run: |
          image="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          docker pull --platform linux/amd64 "${image}"
          just container smoke "${image}" "${GITHUB_SHA}"

      - name: Scan every published architecture
        shell: bash
        run: |
          image="${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
          just security image "${image}" linux/amd64
          just security image "${image}" linux/arm64

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    permissions:
      attestations: read
      contents: write
      packages: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}

    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Log in to GHCR for attestation verification
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Verify published image provenance
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/container.yml" \
            --source-ref "${GITHUB_REF}"

      - name: Publish versioned GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --notes "Container image: \`${IMAGE}@${DIGEST}\`"

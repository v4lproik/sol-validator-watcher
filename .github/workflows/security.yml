name: security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install repository toolchain
        uses: jdx/mise-action@v2

      - name: Audit Rust dependency policy
        run: just security dependencies

      - name: Scan repository dependencies, secrets, and configuration
        run: just security repository

name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAGES_AUTO_ENABLE: ${{ vars.PAGES_AUTO_ENABLE }}
      PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
    outputs:
      pages_should_run: ${{ steps.pages.outputs.should_run }}

    steps:
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const enablementTokenConfigured =
              (process.env.PAGES_ENABLEMENT_TOKEN || '').trim() !== '';
            const autoEnableRequested =
              (process.env.PAGES_AUTO_ENABLE || '').trim().toLowerCase() === 'true';

            try {
              await github.request('GET /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('should_run', 'true');
              core.setOutput('enablement', 'false');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              if (enablementTokenConfigured && autoEnableRequested) {
                core.notice(
                  'GitHub Pages is not enabled; configure-pages will attempt enablement.'
                );
                core.setOutput('should_run', 'true');
                core.setOutput('enablement', 'true');
              } else {
                core.notice(
                  'Skipping coverage-pages because GitHub Pages is not enabled. To auto-enable it, set PAGES_AUTO_ENABLE=true and configure PAGES_ENABLEMENT_TOKEN.'
                );
                core.setOutput('should_run', 'false');
                core.setOutput('enablement', 'false');
              }
            }

      - name: Check out repository
        if: ${{ steps.pages.outputs.should_run == 'true' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure GitHub Pages
        if: ${{ steps.pages.outputs.should_run == 'true' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          token: ${{ env.PAGES_ENABLEMENT_TOKEN != '' && env.PAGES_ENABLEMENT_TOKEN || github.token }}
          enablement: ${{ steps.pages.outputs.enablement }}

      - name: Install toolchain with mise
        if: ${{ steps.pages.outputs.should_run == 'true' }}
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Build Pages site
        if: ${{ steps.pages.outputs.should_run == 'true' }}
        run: just site build

      - name: Upload Pages artifact
        if: ${{ steps.pages.outputs.should_run == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages_should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

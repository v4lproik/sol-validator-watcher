name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this relative to the current roadmap?
      options:
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational or product gap are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should operators or maintainers be able to do after this lands?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for this issue to be done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Metrics, dashboards, configs, or operator workflow details.
  - type: input
    id: links
    attributes:
      label: Related issue, PR, roadmap item, or dependency
      placeholder: e.g. #123, docs/operator-observability-roadmap.md

name: Bug report
description: Report a defect or regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgently does this need to be addressed?
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, repeatable sequence.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and context
      description: Include watcher logs, Prometheus errors, or Grafana symptoms as relevant.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true once this bug is fixed?
      placeholder: |
        - [ ] Reproduction no longer fails
        - [ ] Coverage or regression test added when practical
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. main @ abc1234
  - type: input
    id: links
    attributes:
      label: Related issue, PR, or incident
      placeholder: e.g. #123, #456, incident-2026-03-25
